<svg xmlns="http://www.w3.org/2000/svg" width="1480" height="930" viewBox="0 0 1480 930" role="img" aria-labelledby="title desc">
  <title id="title">RAGU: сохраняем строгую проверку и добавляем независимую ветку</title>
  <desc id="desc">Первоначальный содержательный ответ не меняется. После UNKNOWN поиск предлагает восстановление. Строгая проверка принимает его сразу или передаёт проверке фрагментов и независимому проверяющему. Отказ любого из двух дополнительных этапов возвращает UNKNOWN. Сохранено 63 из 477 предложений вместо 27; ROUGE-L вырос с 0,41697 до 0,43086. Неподтверждённых ответов в новом аудите стало 85 вместо 83.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#526579"/></marker>
    <marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#16815d"/></marker>
    <marker id="red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#a75349"/></marker>
    <style>
      text { font-family: 'Segoe UI', Arial, sans-serif; fill: #193044; }
      .title { font-size: 30px; font-weight: 700; }
      .subtitle { font-size: 18px; fill: #526579; }
      .heading { font-size: 19px; font-weight: 650; }
      .body { font-size: 18px; }
      .small { font-size: 16px; fill: #526579; }
      .label { font-size: 16px; font-weight: 600; }
      .box { fill: #fff; stroke: #b5c3d0; stroke-width: 2; }
      .new { fill: #eef5ff; stroke: #5b89b8; stroke-width: 2; }
      .ok { fill: #e9f6ef; stroke: #16815d; stroke-width: 2; }
      .no { fill: #fff0ed; stroke: #c9857a; stroke-width: 2; }
      .flow { fill: none; stroke: #526579; stroke-width: 2.5; marker-end: url(#arrow); }
      .yesflow { fill: none; stroke: #16815d; stroke-width: 2.5; marker-end: url(#green); }
      .noflow { fill: none; stroke: #a75349; stroke-width: 2.5; marker-end: url(#red); }
      .stat { font-size: 28px; font-weight: 700; }
    </style>
  </defs>
  <rect width="1480" height="930" fill="#f7f9fc"/>
  <text x="50" y="54" class="title">Больше ответов — с дополнительной независимой проверкой</text>
  <text x="50" y="86" class="subtitle">Принятые строгим фильтром ответы сохраняются. Для остальных добавлена отдельная ветка.</text>

  <rect x="50" y="120" width="270" height="86" rx="14" class="box"/>
  <text x="74" y="154" class="heading">Первоначальный ответ</text>
  <text x="74" y="184" class="small">До дополнительного поиска</text>
  <path d="M320 160 H1170" class="yesflow"/>
  <text x="560" y="147" class="label" fill="#16815d">Есть содержательный ответ → без изменений</text>

  <rect x="1170" y="120" width="260" height="86" rx="14" class="ok"/>
  <text x="1200" y="155" class="heading">Выдать ответ</text>
  <text x="1200" y="184" class="small">Текст не переписывается</text>

  <path d="M185 206 V290" class="flow"/>
  <text x="200" y="257" class="label">UNKNOWN</text>
  <rect x="50" y="290" width="270" height="116" rx="14" class="box"/>
  <text x="73" y="325" class="heading">Дополнительный поиск</text>
  <text x="73" y="355" class="body">Предложение ответа</text>
  <text x="73" y="382" class="small">Тот же процесс восстановления</text>
  <path d="M320 345 H400" class="flow"/>

  <rect x="400" y="290" width="270" height="116" rx="14" class="box"/>
  <text x="425" y="325" class="heading">Строгая проверка</text>
  <text x="425" y="355" class="body">Прежняя цепочка</text>
  <text x="425" y="382" class="small">доказательств и точные цитаты</text>
  <path d="M535 290 V230 H1260 V206" class="yesflow"/>
  <text x="620" y="221" class="label" fill="#16815d">Принято строгим фильтром</text>
  <path d="M670 345 H750" class="flow"/>
  <text x="682" y="333" class="label">Отказ</text>

  <rect x="750" y="290" width="270" height="116" rx="14" class="new"/>
  <text x="774" y="325" class="heading">Проверка фрагментов</text>
  <text x="774" y="355" class="body">Есть вся нужная связь?</text>
  <text x="774" y="382" class="small">Цитирование по ID источников</text>
  <path d="M1020 345 H1100" class="flow"/>
  <text x="1048" y="332" class="label">Да</text>

  <rect x="1100" y="290" width="330" height="116" rx="14" class="new"/>
  <text x="1125" y="325" class="heading">Независимая проверка</text>
  <text x="1125" y="355" class="body">Нет пропусков и противоречий?</text>
  <text x="1125" y="382" class="small">Вопрос + полный контекст + ответ</text>
  <path d="M1360 290 V206" class="yesflow"/>
  <text x="1370" y="263" class="label" fill="#16815d">Да</text>

  <text x="400" y="450" class="small">Новая ветка: два положительных решения.</text>
  <text x="400" y="476" class="small">Второй проверяющий не видит</text>
  <text x="400" y="502" class="small">первое доказательство или решение.</text>

  <path d="M1265 406 V550" class="noflow"/>
  <text x="1282" y="515" class="label" fill="#a75349">Отказ</text>
  <path d="M885 406 V593 H1100" class="noflow"/>
  <text x="899" y="574" class="label" fill="#a75349">Отказ</text>
  <path d="M185 406 V640 H1060 V615 H1100" class="noflow"/>
  <text x="207" y="622" class="small">Поиск тоже не дал ответа</text>
  <rect x="1100" y="550" width="330" height="86" rx="14" class="no"/>
  <text x="1125" y="583" class="heading">Вернуть исходный UNKNOWN</text>
  <text x="1125" y="612" class="small">Исходные доказательства и контекст</text>

  <line x1="50" y1="678" x2="1430" y2="678" stroke="#d4dee8"/>
  <rect x="50" y="700" width="430" height="110" rx="14" fill="#fff"/>
  <text x="75" y="732" class="small">Сохранённые предложения: из 477</text>
  <text x="75" y="774" class="stat">27 → 63</text>
  <text x="266" y="774" class="body">+36 ответов</text>
  <rect x="510" y="700" width="450" height="110" rx="14" fill="#fff"/>
  <text x="535" y="732" class="small">ROUGE-L без стемминга · 2117 вопросов</text>
  <text x="535" y="774" class="stat">0,41697 → 0,43086</text>
  <rect x="990" y="700" width="440" height="110" rx="14" fill="#fff"/>
  <text x="1015" y="732" class="small">Правильных / выданных · новый аудит 400</text>
  <text x="1015" y="774" class="stat">176/248 → 184/256</text>
  <text x="50" y="854" class="body">Ограничение: неподтверждённых стало 83 → 85, хотя их доля снизилась 33,47% → 33,20%.</text>
  <text x="50" y="883" class="small">95%-й интервал изменения этой доли пересекает ноль. Снижение неподтверждённости статистически не доказано.</text>
  <text x="50" y="912" class="small">Все числа качества — оценки Sol. Фильтр применяется только после первоначального UNKNOWN.</text>
</svg>
